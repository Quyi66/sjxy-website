# =============================
# HTTP server (Direct proxy for backend APIs, redirect everything else)
# =============================
server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;
    set $backend_upstream ${BACKEND_URL};

    # Default upload limit for all HTTP routes
    client_max_body_size 500M;

    # Direct proxy for GFS upload/download on port 80 (bypass redirect)
    location ~ ^/(sjxy-console|sjxy-portal|oplus-portal)/gfs {
        client_body_timeout 300s;
        send_timeout 300s;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Direct proxy for other backend API endpoints on port 80 (bypass redirect)
    location ~ ^/(api|sjxy-console|sjxy-portal|sjxy-gfs|oplus-[a-z0-9_-]+)/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # WebSocket upgrade (where applicable)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Direct proxy for scheduling, upload, and documentation endpoints on port 80
    location /sjxy-scheduler {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /sjxy-upload {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /patch-upload {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /sjxy-doc {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 内部 git 流量豁免 https 跳转（163 agent 经 jgit 拉取 playbook 脚本仓库）
    location /sjxy-scriptrepo/ {
        proxy_pass http://sjxy:80/sjxy-scriptrepo/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /sjxy-ws/ {
      proxy_pass $backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
    }


    # Redirect all frontend asset and web requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# =============================
# HTTPS server
# =============================
server {
    listen 443 ssl;
    server_name _;

    # SSL certificate
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # SSL protocol & cipher settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS (optional, uncomment for production)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Global root for any top-level assets (not used for alias locations)
    root /usr/share/nginx/html;
    index index.html;

    # Logging
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;
    server_tokens off;

    # Default upload limit for all routes
    client_max_body_size 500M;

    # Compression (动态压缩)
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_proxied any;
    gzip_types
      text/plain
      text/css
      text/xml
      text/javascript
      application/json
      application/javascript
      application/x-javascript
      application/xml+rss
      application/atom+xml
      image/svg+xml
      font/woff
      font/woff2;

    # 优先使用预压缩文件（需要 ngx_http_gzip_static_module）
    gzip_static on;

    # Brotli 预压缩（如果有 brotli 模块）
    # brotli_static on;

    # Security headers (tune as needed)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Security policy for OPSmind SPA responses. The frame-ancestors rule keeps
    # OPSmind embeddable only by the same origin while allowing its own local
    # assets, API/WebSocket calls, and configured iframe integrations to work.
    set $opsmind_csp "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; font-src 'self' data:; connect-src 'self' http: https: ws: wss:; frame-src 'self' http: https:; worker-src 'self' blob:";

    # =============================
    # Backend API/WebSocket proxy
    # =============================
    # Placeholder substituted at container start by entrypoint (envsubst)
    # Single BACKEND_URL, e.g. http://10.1.40.112:80 or http://opsmind:80
    # Docker internal DNS resolver (required when BACKEND_URL uses container names)
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;
    set $backend_upstream ${BACKEND_URL};

    # Increase upload limit for GFS endpoint to 100M
    location ~ ^/(sjxy-console|sjxy-portal|oplus-portal)/gfs {
        # Increase timeouts for large uploads
        client_body_timeout 300s;
        send_timeout 300s;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ~ ^/(api|sjxy-console|sjxy-portal|sjxy-gfs|oplus-[a-z0-9_-]+)/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # WebSocket upgrade (where applicable)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Direct proxy for scheduling, upload, and documentation endpoints on port 443
    location /sjxy-scheduler {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /sjxy-upload {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /patch-upload {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /sjxy-doc {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # =============================
    # KoreOPS (Vue) served under /KoreOPS/
    # =============================
    location ^~ /KoreOPS/ {
        alias /usr/share/nginx/html/opsmind/;
        index index.html;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $opsmind_csp always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), accelerometer=(), gyroscope=(), magnetometer=()" always;

        # Static caching (scoped to this alias)
        location ~* \.(js|css|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|eot|otf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy $opsmind_csp always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
            add_header X-Permitted-Cross-Domain-Policies "none" always;
            add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), accelerometer=(), gyroscope=(), magnetometer=()" always;
            try_files $uri $uri/ =404;
        }

        # SPA fallback
        try_files $uri $uri/ /KoreOPS/index.html;
    }

    # Avoid caching HTML entry to prevent stale preload graphs
    location = /KoreOPS/index.html {
        alias /usr/share/nginx/html/opsmind/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $opsmind_csp always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), accelerometer=(), gyroscope=(), magnetometer=()" always;
    }
    # version.json 用于前端版本更新检测，禁止缓存
    location = /KoreOPS/version.json {
        alias /usr/share/nginx/html/opsmind/version.json;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $opsmind_csp always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), accelerometer=(), gyroscope=(), magnetometer=()" always;
    }
    # Ensure /KoreOPS/ always serves the SPA entry (avoid occasional 404s)
    location = /KoreOPS/ { try_files /does-not-exist /KoreOPS/index.html; }

    # Redirect root and the old visible app path to KoreOPS
    location = / { return 302 /KoreOPS/; }
    location = /opsMind { return 302 /KoreOPS/; }
    location ^~ /opsMind/ { rewrite ^/opsMind/(.*)$ /KoreOPS/$1 permanent; }

    # Optional: backward compatibility to older assets built with /opsmind/base/
    # Keep SPA fallback within the same prefix to avoid serving HTML to JS asset requests
    location ^~ /opsmind/base/ {
        alias /usr/share/nginx/html/opsmind/;
        index index.html;
        try_files $uri $uri/ /KoreOPS/index.html;
    }

    # 内部 git 流量豁免 https 跳转（163 agent 经 jgit 拉取 playbook 脚本仓库）
    location /sjxy-scriptrepo/ {
        proxy_pass http://sjxy:80/sjxy-scriptrepo/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /sjxy-ws/ {
      proxy_pass $backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html { root /usr/share/nginx/html; }
}
