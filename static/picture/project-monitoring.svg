  <text x="64" y="159" class="meta">03 / 可视化展示</text>
  <text x="64" y="204" class="label">Grafana</text>
  <text x="64" y="246" class="body">自定义仪表盘 · 多维指标 · 数据查询 · 历史数据</text>
  <path d="M480 322V282" class="arrow"/>
  <rect x="40" y="332" width="880" height="226" rx="12" class="panel"/>
