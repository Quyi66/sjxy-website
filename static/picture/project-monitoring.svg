<svg xmlns="http://www.w3.org/2000/svg" width="960" height="880" viewBox="0 0 960 880" role="img" aria-labelledby="title desc">
  <title id="title">基础架构监控方案</title>
  <desc id="desc">底层应用、容器、数据库及系统经 Prometheus 集群采集数据，结合数据管理、分析和通讯服务，在 Grafana 中展示。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#087f9b" stroke-width="1.5"/></marker></defs>
  <style>text{font-family:'Microsoft YaHei','PingFang SC',Arial,sans-serif;fill:#17243c;font-size:22px}.title{font-size:32px;font-weight:700}.label{font-size:25px;font-weight:700}.meta{font-size:18px;fill:#087f9b;font-weight:700;letter-spacing:1px}.body{fill:#435168}.panel{fill:#f5f8fa;stroke:#dce5eb}.accent{fill:#eaf7fb;stroke:#b9dfe9}.card{fill:#fff;stroke:#dce5eb}.arrow{fill:none;stroke:#087f9b;stroke-width:2;marker-end:url(#arrow)}</style>
  <rect width="960" height="880" rx="16" fill="#fff"/>
  <text x="40" y="46" class="meta">CASE STUDY / MONITORING</text>
  <text x="40" y="94" class="title">基础架构监控方案</text>
