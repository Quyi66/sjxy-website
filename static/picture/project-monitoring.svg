  <rect x="64" y="388" width="252" height="144" rx="10" class="card"/>
  <text x="86" y="428" class="label">数据管理</text>
  <text x="86" y="472" class="body">用户管理 · 资源定义</text>
  <text x="86" y="507" class="body">监控设备 · 存储设备</text>
  <rect x="334" y="388" width="268" height="144" rx="10" class="card"/>
  <text x="356" y="428" class="label">数据分析</text>
  <text x="356" y="472" class="body">监控设备 · 调试配置</text>
  <text x="356" y="507" class="body">数据汇总</text>
  <rect x="620" y="388" width="276" height="144" rx="10" class="card"/>
  <text x="642" y="428" class="label">通讯服务</text>
  <text x="642" y="472" class="body">邮件告警 · 事件平台</text>
  <text x="642" y="507" class="body">AMQP</text>
