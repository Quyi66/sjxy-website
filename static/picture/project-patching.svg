<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img" aria-labelledby="title desc">
  <title id="title">Linux 补丁统一管理方案</title>
  <desc id="desc">第三方软件源和红帽官方订阅同步软件包，通过补丁管理平台及 Ansible 自动纳管 RHEL、SuSE 和 CentOS 服务器。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#087f9b" stroke-width="1.5"/></marker></defs>
  <style>text{font-family:'Microsoft YaHei','PingFang SC',Arial,sans-serif;fill:#17243c;font-size:22px}.title{font-size:32px;font-weight:700}.label{font-size:25px;font-weight:700}.meta{font-size:18px;fill:#087f9b;font-weight:700;letter-spacing:1px}.body{fill:#435168}.card{fill:#f5f8fa;stroke:#dce5eb}.arrow{fill:none;stroke:#087f9b;stroke-width:2;marker-end:url(#arrow)}</style>
  <rect width="960" height="760" rx="16" fill="#fff"/>
  <text x="40" y="46" class="meta">CASE STUDY / PATCH MANAGEMENT</text>
  <text x="40" y="94" class="title">Linux 补丁统一管理方案</text>
  <text x="40" y="134" class="body">软件包同步 → 补丁管理 → 多厂商系统纳管</text>
  <rect x="40" y="174" width="424" height="110" rx="12" class="card"/>
  <rect x="496" y="174" width="424" height="110" rx="12" class="card"/>
  <g text-anchor="middle">
    <text x="252" y="217" class="label">第三方软件源</text>
    <text x="252" y="255" class="body">同步所需软件包</text>
    <text x="708" y="217" class="label">红帽官方订阅</text>
    <text x="708" y="255" class="body">使用订阅账号同步软件包</text>
  </g>
  <path d="M252 284V320H480V352" class="arrow"/>
  <path d="M708 284V320H480" fill="none" stroke="#087f9b" stroke-width="2"/>
  <rect x="180" y="362" width="600" height="132" rx="12" fill="#eaf7fb" stroke="#b9dfe9"/>
  <text x="480" y="411" text-anchor="middle" class="title">补丁管理平台</text>
