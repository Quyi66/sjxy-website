    <text x="180" y="635" class="label">RHEL 6</text><text x="180" y="674" class="body">Linux 服务器</text>
    <text x="480" y="635" class="label">SuSE</text><text x="480" y="674" class="body">Linux 服务器</text>
    <text x="780" y="635" class="label">CentOS</text><text x="780" y="674" class="body">Linux 服务器</text>
